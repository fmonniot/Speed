<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speed — Interaction Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  * { box-sizing: border-box; }
  #root { width: 100%; height: 100vh; }
  .material-symbols-rounded { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screen-frame.jsx"></script>
<script type="text/babel" src="material3.jsx"></script>
<script type="text/babel" src="annotations.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { M3_GREEN } = window;
const { AnnotatedScreen, HowToRead, SPECS } = window;
const {
  M3Idle, M3Live, M3Summary, M3Detail, M3History,
  M3Segment, M3SegmentList, M3Settings, M3Stats, M3Export,
} = window;

// annotated artboard = caption-aligned screen (320) + spec panel (384)
const AW = 320 + 384, AH = 708;

const RECORD = [
  { id: 'idle',    label: '01 · Ready / Home',   Comp: M3Idle,    spec: SPECS.idle },
  { id: 'live',    label: '02 · Live HUD',       Comp: M3Live,    spec: SPECS.live },
  { id: 'summary', label: '03 · Ride summary',   Comp: M3Summary, spec: SPECS.summary },
];
const REVISIT = [
  { id: 'history', label: '01 · Trips list',     Comp: M3History, spec: SPECS.history },
  { id: 'detail',  label: '02 · Trace / detail', Comp: M3Detail,  spec: SPECS.detail },
];
const STATS = [
  { id: 'stats',       label: '01 · Overview',       Comp: M3Stats,       spec: SPECS.stats },
  { id: 'segmentlist', label: '02 · Segments list',  Comp: M3SegmentList, spec: SPECS.segmentlist },
  { id: 'segment',     label: '03 · Segment detail', Comp: M3Segment,     spec: SPECS.segment },
];
const DATA = [
  { id: 'settings', label: '01 · Settings',     Comp: M3Settings, spec: SPECS.settings },
  { id: 'export',   label: '02 · Export sheet', Comp: M3Export,   spec: SPECS.export },
];

// Return an array of artboards (not a wrapper component) so DesignCanvas's
// child-type walk can see each DCArtboard.
function boards(list) {
  return list.map(({ id, label, Comp, spec }) => (
    <DCArtboard key={id} id={id} label={label} width={AW} height={AH}>
      <AnnotatedScreen Comp={Comp} spec={spec} scheme={M3_GREEN} />
    </DCArtboard>
  ));
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="intro" title="Speed · Interaction review" subtitle="What every element does when you touch it — pinned per screen">
        <DCArtboard id="legend" label="Read me" width={360} height={AH}>
          <HowToRead />
        </DCArtboard>
      </DCSection>

      <DCSection id="record-spec" title="1 · Record a ride" subtitle="Ready → Live HUD → Summary">
        {boards(RECORD)}
      </DCSection>

      <DCSection id="revisit-spec" title="2 · Open a specific ride" subtitle="Trips → trace & detail">
        {boards(REVISIT)}
      </DCSection>

      <DCSection id="stats-spec" title="3 · See your statistics" subtitle="Overview → segments → segment detail">
        {boards(STATS)}
      </DCSection>

      <DCSection id="data-spec" title="4 · Tune & export your data" subtitle="Settings → raw-data export">
        {boards(DATA)}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
